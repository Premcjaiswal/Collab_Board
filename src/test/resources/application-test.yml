spring:
  datasource:
    url: jdbc:h2:mem:collabboard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true

app:
  mail:
    enabled: false
    log-codes: false
  security:
    otp-secret: test-only-otp-secret
  storage:
    root: target/test-uploads

logging:
  level:
    org.hibernate.SQL: WARN
    com.collabboard: INFO
