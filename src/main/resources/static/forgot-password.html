<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · CollabBoard</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="forgot">
<main class="auth-main" id="main">
  <div class="auth-card">
    <p><a class="brand" href="/"><img src="/img/logo.svg" alt=""> CollabBoard</a></p>
    <div class="card">
      <h1>Forgot your password?</h1>
      <p class="muted">Enter your verified college email. If an account exists, we'll email a 6-digit reset code.</p>
      <form id="forgot-form" class="form" novalidate>
        <div class="alert alert-error form-alert" role="alert" hidden></div>
        <div class="field" data-field="email">
          <label for="email" class="req">College email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <div class="error"></div>
        </div>
        <button type="submit" class="btn btn-block">Send reset code</button>
        <div class="row between small">
          <a href="/reset-password.html">I already have a code</a>
          <a href="/">Back to sign in</a>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
