<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · CollabBoard</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="reset">
<main class="auth-main" id="main">
  <div class="auth-card">
    <p><a class="brand" href="/"><img src="/img/logo.svg" alt=""> CollabBoard</a></p>
    <div class="card">
      <h1>Reset password</h1>
      <p class="muted">Enter the code from your email and choose a new password.</p>
      <form id="reset-form" class="form" novalidate>
        <div id="flash" class="alert alert-info" role="status" hidden></div>
        <div class="alert alert-error form-alert" role="alert" hidden></div>
        <div class="field" data-field="email">
          <label for="email" class="req">College email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <div class="error"></div>
        </div>
        <div class="field" data-field="code">
          <label for="code" class="req">Reset code</label>
          <input id="code" name="code" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" required>
          <div class="error"></div>
        </div>
        <div class="field" data-field="newPassword">
          <label for="newPassword" class="req">New password</label>
          <input id="newPassword" name="newPassword" type="password" maxlength="72" autocomplete="new-password" required>
          <div class="hint">At least 8 characters with a letter and a digit.</div>
          <div class="error"></div>
        </div>
        <div class="field" data-field="confirmPassword">
          <label for="confirmPassword" class="req">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" maxlength="72" autocomplete="new-password" required>
          <div class="error"></div>
        </div>
        <button type="submit" class="btn btn-block">Reset password</button>
        <div class="row between small">
          <a href="/forgot-password.html">Request a new code</a>
          <a href="/">Back to sign in</a>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
