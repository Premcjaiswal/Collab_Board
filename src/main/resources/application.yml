# CollabBoard configuration. Secrets are NEVER stored here: they come from environment variables
# or from an optional, git-ignored ".env" file in the working directory (see .env.example).
spring:
  application:
    name: collabboard
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/collabboard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:collabboard}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Store java.time.Instant in plain DATETIME(6) columns (UTC), matching the Flyway schema.
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Hard upper bounds; per-assignment/project limits are enforced in the storage service.
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:120MB}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  # SERVER_PORT locally; hosting platforms such as Render provide PORT.
  port: ${SERVER_PORT:${PORT:8080}}
  # "native" behind a hosting platform's proxy so the real client IP is used (login lockout); none locally.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:60m}
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
        name: CBSESSION

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail:
    # When false, emails are not sent; they are only logged (without codes unless log-codes is true).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:collabboard.verify@gmail.com}
    from-name: ${MAIL_FROM_NAME:CollabBoard}
    # DEVELOPMENT ONLY: writes one-time codes to the application log when mail is disabled.
    log-codes: ${MAIL_LOG_CODES:false}
    # smtp (default) or brevo: HTTPS email API for hosts that block outbound SMTP (e.g. Render free).
    transport: ${MAIL_TRANSPORT:smtp}
    brevo-api-key: ${BREVO_API_KEY:}
  security:
    # Secret key used to HMAC one-time codes before storing them. Must be set in production.
    otp-secret: ${OTP_SECRET:}
    otp-ttl-minutes: ${OTP_TTL_MINUTES:10}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    otp-resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    otp-max-sends-per-hour: ${OTP_MAX_SENDS_PER_HOUR:5}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  registration:
    # Comma separated list of permitted college email domains, e.g. "college.edu,students.college.edu".
    # Empty means any domain is accepted (useful for local development only).
    student-email-domains: ${STUDENT_EMAIL_DOMAINS:}
    teacher-email-domains: ${TEACHER_EMAIL_DOMAINS:}
  storage:
    root: ${STORAGE_ROOT:./data/uploads}
    # filesystem (default) or database: keep file contents in MySQL on hosts without a persistent disk.
    type: ${STORAGE_TYPE:filesystem}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    # preferred_instant_jdbc_type is intentional (see jpa properties); suppress the repeated "incubating" notice.
    org.hibernate.orm.incubating: ERROR
